# Natom Visite - build iOS firmata (firma automatica nel cloud con chiave API App Store Connect) + upload TestFlight.
# Secrets (Settings > Secrets and variables > Actions): ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (testo .p8 o base64), APPLE_TEAM_ID
# Il database lead (public/base.json) NON è nel repository: l'app scarica i negozi dal cloud Firebase al primo accesso.
# Prerequisito una tantum: l'app "Natom Visite" (bundle com.natomdiamonds.visite) deve esistere in App Store Connect.
name: iOS TestFlight
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "ios/**", "index.html", "public/**", "package*.json", "capacitor.config.json", ".github/workflows/ios-testflight.yml"]

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

env:
  MARKETING_VERSION: "1.0.0"
  BUNDLE_ID: com.natomdiamonds.visite

jobs:
  testflight:
    # solo dal repository originale e solo se avviato dal proprietario
    if: github.repository == 'nadav1983/natom-visite' && github.actor == github.repository_owner
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - name: Check secrets
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!v}" ] || { echo "::error::Manca il secret $v"; exit 1; }
          done
      - name: Select Xcode 26+
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
          xcodebuild -version | grep -qE 'Xcode (2[6-9]|[3-9][0-9])' || { echo "::error::Serve Xcode 26 o successivo"; exit 1; }
      - name: Install API key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          else printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY"; fi
          grep -q 'BEGIN PRIVATE KEY' "$KEY" || { echo "::error::ASC_KEY_P8 non è un .p8 valido"; exit 1; }
          chmod 600 "$KEY"; echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
      - name: Web build + Capacitor sync (senza base.json)
        run: |
          npm ci
          rm -f public/base.json
          npm run build
          test ! -f dist/base.json
          npx cap sync ios
      - name: Archive (non firmato; la firma App Store avviene all'export)
        run: |
          BUILD_NUMBER=$(( ${{ github.run_number }} * 10 + ${{ github.run_attempt }} ))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          xcodebuild -version
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive
          PL="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app/Info.plist"
          echo "Versione: $(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$PL") ($(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$PL"))"
      - name: Export IPA + upload TestFlight
        run: |
          mk_opts() { cat > "$1" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$2</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><false/>
          </dict></plist>
          PLIST
          }
          mk_opts "$RUNNER_TEMP/export.plist" export
          mk_opts "$RUNNER_TEMP/upload.plist" upload
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportPath "$RUNNER_TEMP/ipa" -exportOptionsPlist "$RUNNER_TEMP/export.plist" "${AUTH[@]}"
          ls -la "$RUNNER_TEMP/ipa"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportPath "$RUNNER_TEMP/upload" -exportOptionsPlist "$RUNNER_TEMP/upload.plist" "${AUTH[@]}"
          echo "Caricata build $MARKETING_VERSION ($BUILD_NUMBER): dopo 5-30 min appare in App Store Connect > TestFlight." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove API key
        if: always()
        run: rm -rf ~/.appstoreconnect/private_keys

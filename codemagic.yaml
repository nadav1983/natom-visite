# Codemagic: build iOS (Capacitor) firmata automaticamente e caricata su TestFlight.
# Prerequisiti in Codemagic (Teams > Integrations > Developer Portal / App Store Connect):
#   - integrazione App Store Connect API chiamata "NatomASC" (Issuer ID, Key ID, file .p8)
#   - variabile APP_STORE_APPLE_ID = Apple ID numerico dell'app (App Store Connect > App > Informazioni sull'app)
workflows:
  ios-testflight:
    name: Natom Visite - iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: NatomASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.natomdiamonds.visite
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        BUNDLE_ID: com.natomdiamonds.visite
        APP_STORE_APPLE_ID: "0000000000"   # <-- sostituire con l'Apple ID dell'app
      node: 20
      xcode: latest
      cocoapods: default
    triggering:
      events: [push]
      branch_patterns:
        - pattern: main
    scripts:
      - name: Dipendenze npm
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Pod install
        script: cd ios/App && pod install
      - name: Certificati e profili (firma automatica via API key)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Numero build
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          cd ios/App && agvtool new-version -all $((LATEST + 1))
      - name: Build IPA
        script: xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-apk:
    name: Natom Visite - Android APK (debug)
    instance_type: linux_x2
    environment:
      node: 20
      java: 17
    scripts:
      - npm ci
      - npm run build
      - npx cap sync android
      - cd android && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
